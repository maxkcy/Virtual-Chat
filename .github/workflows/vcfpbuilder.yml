name: Build and Deploy Flatpak Manually

on:
  workflow_dispatch:  # This creates a manual trigger button in GitHub Actions
    # Optional: Add input fields so you can specify what to build
    inputs:
      ref:
        description: 'Git ref to build (tag, branch, or commit SHA)'
        required: true
        default: 'main'
        type: string
      version:
        description: 'Version tag (e.g., v1.2.3)'
        required: false
        type: string

jobs:
  flatter:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/andyholmes/flatter/gnome:48
      options: --privileged

    strategy:
      matrix:
        arch: [x86_64]

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Use the manual input to decide what to build
          ref: ${{ github.event.inputs.ref || 'main' }}
          fetch-depth: 0

      - name: Import GPG Key
        id: gpg
        uses: crazy-max/ghaction-import-gpg@v6
        with:
          gpg_private_key: ${{ secrets.GPG_PRIVATE_KEY }}
          passphrase: ${{ secrets.GPG_PASSPHRASE }}

      - name: Build with Flatter
        uses: andyholmes/flatter@main
        with:
          files: |
            flathub/io.github.maxkcy.virtual-chat.yaml
          arch: ${{ matrix.arch }}
          gpg-sign: ${{ steps.gpg.outputs.fingerprint }}
          upload-pages-artifact: true
          upload-bundles: true
          upload-pages-includes: |
            index.html

  deploy:
    runs-on: ubuntu-latest
    needs: flatter
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
